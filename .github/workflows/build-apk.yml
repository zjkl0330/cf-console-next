name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: assembleRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Apply Cloudflare icons
        run: cp -r native-res/mipmap-xxhdpi native-res/mipmap-xhdpi native-res/mipmap-hdpi native-res/mipmap-mdpi native-res/mipmap-xxxhdpi android/app/src/main/res/ && ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Stamp version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VER=$V" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode ${V//./0}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.CFNEXT_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK (signed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.CFNEXT_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.CFNEXT_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.CFNEXT_KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "cf-next-v${VER}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cf-next-release-apk
          path: "cf-next-v${{ env.VER }}-release.apk"
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: "CF-next v${{ env.VER }}（生产签名 APK）"
          body: |
            自动构建的生产版 APK（release 签名，keystore 存于 Actions Secrets）。
            应用名 CF-next，图标为 Cloudflare 官方云朵 mark，内置演示登录门（口令见登录页提示）。
          files: "cf-next-v${{ env.VER }}-release.apk"
          make_latest: "true"
          overwrite_files: true
