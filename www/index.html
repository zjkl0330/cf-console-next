        const cols=rows.length?Object.keys(rows[0]):[];
        ui.sqlResult={cols:cols.length?cols:["(无返回行)"],rows:rows.map(x=>cols.map(c=>x[c]==null?"NULL":String(x[c]))),cost:0};
        const out=$("#sql-out");
        out.innerHTML=`<div class="sql-meta"><span>${rows.length} 行</span><span>${ms} ms</span><span>真实 D1 · ${(meta&&meta.changed_db)||0} 行改动</span></div>
          <div class="panel sql-out"><div class="tbl-wrap"><table class="tbl">
          <thead><tr>${ui.sqlResult.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
          <tbody>${rows.length?ui.sqlResult.rows.map(rr=>`<tr style="cursor:default">${rr.map(c=>`<td class="num">${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${ui.sqlResult.cols.length}" class="muted" style="text-align:center;padding:18px">确实为空（0 行）</td></tr>`}</tbody>
          </table></div></div>`;
        toast("D1 查询完成 · "+rows.length+" 行","info");
      };
      if(/^select\b/i.test(s)){
        const t0=performance.now();
        try{
          const r=await cfCall("POST",`/accounts/${db.account}/d1/database/${db.id}/query`,{sql:s});
          const r0=Array.isArray(r)?r[0]:r;
          show((r0&&r0.results)||[],r0&&r0.meta,Math.round(performance.now()-t0));
        }catch(e){toast("D1 报错："+e.message,"bad");}
        return;
      }
      confirmWrite({title:"在 "+db.name+" 执行 SQL",method:"POST",path:`/accounts/${db.account}/d1/database/${db.id}/query`,
        body:{sql:s},danger:/^(insert|update|delete|drop|alter|create|replace)/i.test(s),okLabel:"执行",
        onOk:(res)=>{const r0=Array.isArray(res)?res[0]:res;show((r0&&r0.results)||[],r0&&r0.meta,0);}});
      return;
    }
    const t0=performance.now();
    const res=runSQL(db,ui.sql);
    ui.sqlResult=res;
    const out=$("#sql-out");
    if(res.error){out.innerHTML=`<div class="note warn">${icon("alert")}<span>${esc(res.error)}</span></div>`;return;}
    out.innerHTML=`<div class="sql-meta"><span>${res.rows.length} 行</span><span>${(performance.now()-t0+res.cost).toFixed(1)} ms</span><span>只读 · 未计费</span></div>
      <div class="panel sql-out"><div class="tbl-wrap"><table class="tbl">
      <thead><tr>${res.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${res.rows.length?res.rows.map(r=>`<tr style="cursor:default">${r.map(c=>`<td class="num">${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${res.cols.length}" class="muted" style="text-align:center;padding:18px">确实为空（0 行）</td></tr>`}</tbody>
      </table></div></div>`;
    toast(`查询完成 · ${res.rows.length} 行`,"info");
  };
  if(ui.sqlResult&&!ui.sqlResult.error)$("#sql-run").click();
}
function runSQL(db,sql){
  const s=sql.trim().replace(/;+\s*$/,"");
  if(!s)return{error:"先写一条 SQL"};
  if(!/^select\b/i.test(s))return{error:"只读控制台：仅支持 SELECT（写操作未放行）"};
  const m=s.match(/^select\s+(.+?)\s+from\s+([a-zA-Z_][\w]*)(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+([\w]+)(\s+desc|\s+asc)?)?(?:\s+limit\s+(\d+))?$/i);
  if(!m)return{error:"解析失败。支持：SELECT 列|*|COUNT(*) FROM 表 [WHERE 列 =/>/< 值] [ORDER BY 列 [DESC]] [LIMIT n]"};
  const[,colsRaw,tName,where,orderCol,orderDir,limit]=m;
  const tbl=db.tables.find(t=>t.name.toLowerCase()===tName.toLowerCase());
  if(!tbl)return{error:`表 ${tName} 不存在。可用：${db.tables.map(t=>t.name).join(", ")}`};
  let rows=tbl.rows.map(r=>Object.fromEntries(tbl.cols.map((c,i)=>[c,r[i]])));
  if(where){
    const wm=where.match(/^([\w]+)\s*(=|!=|>=|<=|>|<|like)\s*(.+)$/i);
    if(!wm)return{error:"WHERE 支持：列 = / != / > / < / >= / <= / LIKE '模式'"};
    const[,col,op,valRaw]=wm;
    if(!tbl.cols.includes(col))return{error:`列 ${col} 不存在`};
    let val=valRaw.trim().replace(/^['"]|['"]$/g,"");
    rows=rows.filter(r=>{
      const cell=r[col],num=parseFloat(val),cn=parseFloat(cell);
      const bothNum=!isNaN(num)&&!isNaN(cn)&&String(cn)===String(cell);
      switch(op.toLowerCase()){
        case"=":return String(cell)===val;case"!=":return String(cell)!==val;
        case">":return bothNum?cn>num:String(cell)>val;case"<":return bothNum?cn<num:String(cell)<val;
        case">=":return bothNum?cn>=num:String(cell)>=val;case"<=":return bothNum?cn<=num:String(cell)<=val;
        case"like":{const re=new RegExp("^"+val.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/%/g,".*").replace(/_/g,".")+"$","i");return re.test(String(cell));}
      }
    });
  }
  const isCount=/^count\(\s*\*\s*\)$/i.test(colsRaw.trim());
  if(isCount){rows=[{"COUNT(*)":rows.length}];}
  else{
    if(orderCol){
      if(!tbl.cols.includes(orderCol))return{error:`排序列 ${orderCol} 不存在`};
      const dir=/desc/i.test(orderDir||"")?-1:1;
      rows.sort((a,b)=>{const x=a[orderCol],y=b[orderCol];return(typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y)))*dir;});
    }
    if(limit)rows=rows.slice(0,+limit);
    if(colsRaw.trim()!=="*"){
      const cols=colsRaw.split(",").map(c=>c.trim());
      for(const c of cols)if(!tbl.cols.includes(c))return{error:`列 ${c} 不存在。可用：${tbl.cols.join(", ")}`};
      rows=rows.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]])));
    }
  }
  const outCols=isCount?["COUNT(*)"]:(colsRaw.trim()!=="*"?colsRaw.split(",").map(c=>c.trim()):tbl.cols);
  return{cols:outCols,rows:rows.map(r=>outCols.map(c=>r[c])),cost:0.4+Math.random()*2};
}

  };

function tokenWizard(){
  const acc=curAccount();
  const zs=DB.zones.filter(z=>z.account===acc.id);
  const GROUPS=["Account","Zone","DNS","Workers Scripts","Pages","KV","D1","R2","Access"];
  const TPL={"只读看板":{Account:"Read",Zone:"Read",DNS:"Read","Workers Scripts":"Read",Access:"Read"},
    "DNS 编辑":{Zone:"Read",DNS:"Edit"},
    "Workers 部署":{"Workers Scripts":"Edit",KV:"Edit",Pages:"Edit"},
    "全资源只读":Object.fromEntries(GROUPS.map(g=>[g,"Read"])),
    "自定义":{}};
  let scope="account";
  const {el,close}=sheet("创建 API 令牌",`
    <div class="field mb"><label>令牌名</label><input class="inp" id="tw-name" placeholder="例：ci-deploy-2" spellcheck="false"/></div>
    <div class="field mb"><label>从模板起步</label><select class="inp" id="tw-tpl">${Object.keys(TPL).map(k=>`<option>${k}</option>`).join("")}</select></div>
    <div class="field mb"><label>资源范围</label>
      <div class="seg" id="tw-scope"><button data-s="account" class="on">整个账号</button><button data-s="zones">指定站点</button></div></div>
    <div id="tw-zones" style="display:none" class="mb">
      ${zs.length?zs.map(z=>`<label class="zt-check"><input type="checkbox" value="${esc(z.name)}"/><span class="mono">${esc(z.name)}</span></label>`).join(""):'<div class="muted" style="font-size:12px">该账号还没有站点</div>'}
    </div>
    <div class="eyebrow mb">权限组（无 / 读 / 编辑）</div>
    ${GROUPS.map(g=>`<div class="zt-perm"><span>${g}</span>
      <div class="seg" data-g="${g}"><button data-l="" class="on">无</button><button data-l="Read">读</button><button data-l="Edit">编辑</button></div></div>`).join("")}
    <div class="muted mt" style="font-size:11px">下一步会完整回显 POST /user/tokens 的请求体，确认后才创建。</div>`,
    `<button class="btn" id="tw-cancel">取消</button><button class="btn primary" id="tw-ok">${icon("chevR",14)} 预览回显</button>`);
  const applyTpl=k=>{
    const t=TPL[k];
    el.querySelectorAll(".zt-perm .seg").forEach(sg=>{
      const lv=t[sg.dataset.g]||"";
      sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===lv));
    });
  };
  applyTpl("只读看板");
  el.querySelector("#tw-tpl").onchange=e=>applyTpl(e.target.value);
  el.querySelectorAll("#tw-scope button").forEach(b=>b.onclick=()=>{
    scope=b.dataset.s;
    el.querySelectorAll("#tw-scope button").forEach(x=>x.classList.toggle("on",x===b));
    el.querySelector("#tw-zones").style.display=scope==="zones"?"block":"none";
  });
  el.querySelectorAll(".zt-perm .seg button").forEach(b=>b.onclick=()=>{
    b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    el.querySelector("#tw-tpl").value="自定义";
  });
  el.querySelector("#tw-cancel").onclick=close;
  el.querySelector("#tw-ok").onclick=()=>{
    const name=el.querySelector("#tw-name").value.trim();
    if(!name)return toast("令牌名不能为空","bad");
    if(DB.apiTokens.some(t=>t.account===acc.id&&t.name===name))return toast("同名令牌已存在","warn");
    const perms=[];
    el.querySelectorAll(".zt-perm .seg").forEach(sg=>{
      const on=sg.querySelector("button.on");
      if(on&&on.dataset.l)perms.push([sg.dataset.g,on.dataset.l]);
    });
    if(!perms.length)return toast("至少给一个权限组（最小权限 ≠ 零权限）","bad");
    const picked=[...el.querySelectorAll("#tw-zones input:checked")].map(i=>i.value);
    if(scope==="zones"&&!picked.length)return toast("指定站点范围：至少勾一个站点","bad");
    const scopeText=scope==="account"?"整个账号":"指定站点 · "+picked.join(", ");
    const body={name,policies:[{effect:"allow",
      resources:scope==="account"?{["com.cloudflare.api.account."+acc.id]:"*"}:Object.fromEntries(zs.filter(z=>picked.includes(z.name)).map(z=>["com.cloudflare.api.zone."+z.id,"*"])),
      permission_groups:perms.map(([g,l])=>g+" · "+l)}]};
    confirmWrite({title:"创建令牌 "+name,method:"POST",path:"/user/tokens",body,okLabel:"创建",onOk:(res)=>{
      const t={account:acc.id,id:(res&&res.id)||hex(32),name,prefix:"",status:"active",issued:new Date().toISOString().slice(0,10),expires:null,
        lastUsed:new Date().toISOString(),scope:scopeText,perms};
      DB.apiTokens.unshift(t);
      logActivity("dns",`创建 API 令牌 ${name}（${perms.length} 项权限）`);
      close();vTokens();tokenValueSheet(t,true,res&&res.value);
    }});
  };
}

function ztAppSheet(a,writable){
  const related=DB.access.policies.filter(p=>p.account===a.account&&p.app===a.name);
  const SESS=["1h","8h","12h","24h","168h"];
  const {el,close}=sheet(a.name,`
    <div class="row wrap mb"><span class="chip vio">${a.type==="ssh"?"SSH":"自托管"}</span><span class="chip info">${esc(a.created)}</span></div>
    <div class="kv-line"><span class="k">域名</span><span class="v">${esc(a.domain)}</span></div>
    ${writable?`<div class="field mt-l"><label>会话时长（到期重新走 IdP 登录）</label>
      <select class="inp" id="za-sess">${SESS.map(s=>`<option value="${s}" ${a.sessions===s?"selected":""}>${s==="168h"?"168h（一周）":s}</option>`).join("")}</select></div>`
      :`<div class="kv-line"><span class="k">会话时长</span><span class="v">${a.sessions}</span></div>`}
    <div class="eyebrow mb mt-l">关联策略 · ${related.length}</div>
    ${related.map(pl=>`<div class="set-row"><span class="chip ${pl.decision==="allow"?"ok":"bad"}">${pl.decision==="allow"?"放行":"拦截"}</span>
      <div class="sr-main"><b>${esc(pl.name)}</b><span>${esc(pl.include)} → ${esc(pl.require)}</span></div></div>`).join("")||'<div class="muted" style="font-size:12px">无关联策略：现在任何人都过不了这道门</div>'}`,
    writable?`<button class="btn primary" id="za-save">${icon("check",14)} 保存会话</button><button class="btn danger" id="za-del">${icon("trash",14)} 删除</button>`:"");
  if(!writable)return;
  el.querySelector("#za-save").onclick=()=>{
    const sess=el.querySelector("#za-sess").value;
    if(sess===a.sessions)return toast("会话时长没变","info");
    const old=a.sessions;
    confirmWrite({title:"修改会话时长 · "+a.name,method:"PATCH",path:`/accounts/${a.account}/access/apps/${a.id}`,
      body:{session_duration:sess},okLabel:"保存",onOk:()=>{

        close();vSecurity();toast("会话时长已更新","ok",{label:"撤销",fn:()=>{a.sessions=old;vSecurity();toast("已恢复 "+old,"info");}});
      }});
  };
  el.querySelector("#za-del").onclick=()=>{
    confirmWrite({title:"删除应用 "+a.name,method:"DELETE",path:`/accounts/${a.account}/access/apps/${a.id}`,
      danger:true,typed:a.name,okLabel:"删除",onOk:()=>{

        DB.access.policies=DB.access.policies.filter(p=>!(p.account===a.account&&p.app===a.name));
        logActivity("waf",`删除 Access 应用 ${a.name}（连带 ${removedPols.length} 条策略）`,"warn");
        close();vSecurity();toast(`应用已删除 · 连带 ${removedPols.length} 条策略`,"ok",{label:"撤销",fn:()=>{
          DB.access.apps.splice(idx,0,a);DB.access.policies.push(...removedPols);ztSyncPolicies(a);vSecurity();toast("已恢复","info");}});
      }});
  };
}

function ztPolSheet(pl,writable){
  const app=DB.access.apps.find(a=>a.account===pl.account&&a.name===pl.app);
  const {el,close}=sheet("策略 · "+pl.name,`
    <div class="kv-line"><span class="k">所属应用</span><span class="v" style="font-family:var(--font)">${esc(pl.app)}</span></div>

      <div class="seg" id="zp-dec"><button data-d="allow" class="${pl.decision==="allow"?"on":""}">放行 ALLOW</button><button data-d="deny" class="${pl.decision==="deny"?"on":""}">拦截 DENY</button></div></div>
    <div class="field mt-l"><label>纳入 include（谁被这条规则覆盖）</label><input class="inp" id="zp-inc" value="${esc(pl.include)}" spellcheck="false"/></div>
    <div class="field mt-l"><label>要求 require（还必须满足什么）</label><input class="inp" id="zp-req" value="${esc(pl.require)}" spellcheck="false"/></div>
    <div class="muted mt" style="font-size:11px">例：include「组 · 核心成员」，require「IdP · GitHub」「国家 · CN/JP」「mTLS 证书」。deny 优先于 allow。</div>`
    :`<div class="timeline mt-l">
      <div class="tl-item info"><div class="t">纳入（include）</div><div class="s" style="font-family:var(--font)">${esc(pl.include)}</div></div>
      <div class="tl-item info"><div class="t">要求（require）</div><div class="s" style="font-family:var(--font)">${esc(pl.require)}</div></div>
      <div class="tl-item ${pl.decision==="allow"?"ok":"bad"}"><div class="t">决策 · ${pl.decision==="allow"?"放行 ALLOW":"拦截 DENY"}</div><div class="s">${esc(pl.app)}</div></div>
    </div>`}`,
    writable?`<button class="btn primary" id="zp-save">${icon("check",14)} 保存策略</button><button class="btn danger" id="zp-del">${icon("trash",14)} 删除</button>`:"");
  if(!writable)return;
  el.querySelectorAll("#zp-dec button").forEach(b=>b.onclick=()=>el.querySelectorAll("#zp-dec button").forEach(x=>x.classList.toggle("on",x===b)));
  el.querySelector("#zp-save").onclick=()=>{
    const decision=el.querySelector("#zp-dec button.on").dataset.d;
    const include=el.querySelector("#zp-inc").value.trim(),require=el.querySelector("#zp-req").value.trim();
    if(!include)return toast("include 不能为空：一条不覆盖任何人的策略没有意义","bad");
    if(decision===pl.decision&&include===pl.include&&require===pl.require)return toast("没有改动","info");
    const old={decision:pl.decision,include:pl.include,require:pl.require};
    confirmWrite({title:"修改策略 "+pl.name,method:"PUT",path:`/accounts/${pl.account}/access/apps/${app?app.id:"?"}/policies/${pl.id}`,
      body:{name:pl.name,decision,include:[include],require:require?[require]:[]},okLabel:"保存",onOk:()=>{
        pl.decision=decision;pl.include=include;pl.require=require||"（无附加要求）";
        logActivity("waf",`策略 ${pl.name} → ${decision.toUpperCase()}`,"warn");
        close();vSecurity();toast("策略已更新 · 立即生效","ok",{label:"撤销",fn:()=>{Object.assign(pl,old);vSecurity();toast("已恢复","info");}});
      }});
  };
  el.querySelector("#zp-del").onclick=()=>{
    confirmWrite({title:"删除策略 "+pl.name,method:"DELETE",path:`/accounts/${pl.account}/access/apps/${app?app.id:"?"}/policies/${pl.id}`,
      danger:true,typed:pl.name,okLabel:"删除",onOk:()=>{
        const idx=DB.access.policies.indexOf(pl);DB.access.policies.splice(idx,1);
        if(app)ztSyncPolicies(app);
        logActivity("waf",`删除策略 ${pl.name}`,"warn");
        close();vSecurity();toast("策略已删除","ok",{label:"撤销",fn:()=>{DB.access.policies.splice(idx,0,pl);if(app)ztSyncPolicies(app);vSecurity();toast("已恢复","info");}});
      }});
  };
}

    scoped(DB.d1s).forEach(d=>out.push({g:"D1",ic:"db",n:d.name,s:d.tables.length+" 张表",run:()=>{ui.dataTab="d1";ui.d1Db=d.id;location.hash="#/data";}}));

    scoped(DB.apiTokens).forEach(t=>out.push({g:"API 令牌",ic:"key",n:t.name,s:t.scope+" · "+(t.status==="active"?"生效":"已过期"),run:()=>location.hash="#/tokens"}));

    out.push({g:"操作",ic:state.writeGate?"lock":"unlock",n:state.writeGate?"开启写保护":"放行走闸门",s:"gate",run:()=>{state.writeGate=!state.writeGate;prefs.set("writeGate",state.writeGate);renderShell();render();}});
    out.push({g:"操作",ic:"gear",n:"打开设置",s:"settings",run:openSettingsSheet});
    return out;
  }
  function draw(){
    const query=q.value.trim().toLowerCase();ui.searchQ=q.value;
    const shown=items().filter(it=>!query||it.n.toLowerCase().includes(query)||it.g.toLowerCase().includes(query)||(it.s||"").toLowerCase().includes(query));
    let lastG="";
    $("#sr-list").innerHTML=shown.length?shown.map((it,i)=>{
      const gh=it.g!==lastG?`<div class="sec-h" style="margin:14px 2px 8px"><b>${it.g}</b></div>`:"";lastG=it.g;
      return gh+`<div class="panel res-card mb" style="padding:11px 13px" data-sr="${i}">
        <span style="color:var(--brand-ink);flex:none">${icon(it.ic,16)}</span>
        <div class="res-main"><div class="t" style="font-size:13px">${esc(it.n)}</div><div class="s">${esc(it.s||"")}</div></div>
        ${icon("chevR",12,"go")}</div>`;
    }).join(""):emptyBlock("search","没有匹配项","换个关键词试试");
    document.querySelectorAll("[data-sr]").forEach(c=>c.onclick=()=>shown[+c.dataset.sr].run());
  }
  q.addEventListener("input",draw);draw();
  setTimeout(()=>q.focus(),320);
}

function addTokenSheet(){
  const {el,close}=sheet("添加账号 · API Token",`
    <div class="note info mb">${icon("key")}<span>令牌是唯一凭证：应用会拿它请求 <span class="mono">/accounts</span> 验证并自动发现账号。<b>不要用 Global API Key。</b>建议最小权限：Account:Read + 各资源 Read，要改 DNS 再加 DNS:Edit。</span></div>
    <div class="field mb"><label>Cloudflare API Token</label>
      <input class="inp mono mask" id="tk-inp" placeholder="40 位以上令牌字符串（可粘贴，显示为圆点）" spellcheck="false" autocomplete="off"/>
      <div class="err" id="tk-err" style="display:none"></div></div>
    <div class="field"><label>本机显示名（可选）</label><input class="inp" id="tk-alias" placeholder="例：备用账号"/></div>`,
    `<button class="btn" id="tk-cancel">取消</button><button class="btn primary" id="tk-ok">${icon("check",14)} 验证并添加</button>`);
  el.querySelector("#tk-cancel").onclick=close;
  el.querySelector("#tk-ok").onclick=async()=>{
    const tok=el.querySelector("#tk-inp").value.trim(),alias=el.querySelector("#tk-alias").value.trim();
    const err=el.querySelector("#tk-err");
    if(tok.length<40||!/^[A-Za-z0-9_-]+$/.test(tok)){err.textContent="令牌格式不对：应为 40 位以上的字母数字串（演示模式不联网，按格式校验）";err.style.display="block";return;}
    const btn=el.querySelector("#tk-ok");btn.disabled=true;btn.innerHTML=`${icon("refresh",14)} 验证中…`;btn.querySelector("svg").style.animation="rot .8s linear infinite";
    if(isLive()){
      const keep=prefs.get("apiToken","");prefs.set("apiToken",tok);
      try{
        await cfCall("GET","/user/tokens/verify");
        const accs=await cfPaged("/accounts");
        accs.forEach(a=>{if(!accounts.some(x=>x.id===a.id))accounts.push({id:a.id,name:alias||a.name,alias:"",email:"",plan:"—",type:a.type||"org",created:(a.created_on||"").slice(0,10),tokenHint:"Bearer cfut_…（本机令牌）",perms:["令牌可见范围"]});});
        if(accs[0]){state.account=accs[0].id;prefs.set("account",state.account);}
        close();render();toast("真实校验通过 · 可见账号 "+accs.length+" 个","ok");
      }catch(e){
        prefs.set("apiToken",keep);btn.disabled=false;btn.innerHTML=`${icon("check",14)} 验证并添加`;
        err.textContent="上游拒绝："+e.message;err.style.display="block";
      }
      return;
    }
    setTimeout(()=>{
      const id=hex(32);

// 鉴权方式：CF API Token 走 Bearer；Global API Key（37 位十六进制）必须走 X-Auth-Key + X-Auth-Email
function isGlobalKey(t){return /^[0-9a-f]{37}$/i.test((t||"").trim());}
function cfAuthHeaders(){

function classifyErr(status,code){

function liveErrText(e){

    permission:"权限不足：这把令牌看不到对应资源",
    rate:"被 CF 限流（429），稍后再试",
    upstream:"Cloudflare 上游异常（5xx）",
    network:"网络不可达：请求没能发出（多为 CORS/网关/无网络）",
    api:"接口返回错误"

async function cfCall(method,path,body){

  const code=err&&err.code!=null?String(err.code):null;

async function cfGraphql(query){

async function cfPaged(path,per=50,maxPages=20){

      p.env[env]=Object.fromEntries(Object.entries(ev).map(([k,v])=>[k,{type:v.type==="secret"?"secret":"plain",value:v.type==="secret"?null:String(v.value==null?"":v.value)}]));}
  }
  return true;
}
async function liveLoadD1(db){
  if(!isLive()||db._loaded)return false;db._loaded=true;
  const r=await cfCall("POST",`/accounts/${db.account}/d1/database/${db.id}/query`,{sql:"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"}).catch(()=>null);
  const set=r&&Array.isArray(r)?r[0]:r;
  const rows=(set&&set.results)||(r&&r.results)||(Array.isArray(r)&&r)||[];
  db.tables=rows.map(x=>({name:x.name,cols:[],rows:[],_loaded:false}));
  return true;
}
async function liveLoadKv(ns){
  if(!isLive()||ns._loaded)return false;ns._loaded=true;
  const keys=await cfPaged(`/accounts/${ns.account}/storage/kv/namespaces/${ns.id}/keys?limit=1000`,1000).catch(()=>[]);
  ns.keys=keys.map(k=>({name:k.name,expiration:k.expiration||null,meta:k.metadata?JSON.stringify(k.metadata):null,value:null}));
  return true;
}
async function liveLoadKvValue(ns,k){
  if(!isLive()||k.value!=null)return k.value;
  const v=await cfRawText("GET",`/accounts/${ns.account}/storage/kv/namespaces/${ns.id}/values/${encodeURIComponent(k.name)}`).catch(()=>"（读取失败）");
  k.value=typeof v==="string"?v:JSON.stringify(v);return true;
}
async function liveLoadR2(b){
  if(!isLive()||b._loaded)return false;b._loaded=true;
  const r=await cfCall("GET",`/accounts/${b.account}/r2/buckets/${encodeURIComponent(b.name)}/objects?per_page=100`).catch(()=>null);
  b.objects=((r&&r.objects)||[]).map(o=>({key:o.key,size:o.size,modified:o.uploaded||o.last_modified||"",cls:o.storage_class||"Standard"}));
  return true;
}
/* ---- 懒加载触发器：数据回来后若还停在原视图则重渲染 ---- */
function liveLazy(promise,viewKey){
  if(!isLive())return;
  Promise.resolve(promise).then(changed=>{if(changed!==true)return;const r=parseHash();if(r.key===viewKey)render();}).catch(()=>{});
}
/* ---- 直连分析：GraphQL 1dGroups + adaptive + /analytics/sql（口径与原网关 traffic 模块一致） ---- */
const liveAn={};
function emptyAnalytics(range){
  const n=range==="24h"?24:range==="30d"?30:7;
  return {points:Array.from({length:n},(_,i)=>({label:range==="24h"?String(i).padStart(2,"0")+":00":(i+1)+"日",requests:0,cached:0,uncached:0,bytes:0,threats:0,visitors:0})),
    total:0,cached:0,cacheRate:0,bytes:0,threats:0,visitors:0,status:[],countries:[],hosts:[],types:[],errCount:0,errRate:0,
    drill:{path:[],bot:[],device:[],cache:[]},origin:{count:0,avgMs:0},httpsRate:0,deltas:{requests:0,bytes:0,visitors:0,threats:0,errors:0,cache:0},peak:0,_loading:true};
}
async function liveAnFetch(accId,range,key){
  const r=cfRange(range);
  const q=`{ viewer { accounts(filter:{accountTag:"${accId}"}) {
    g: httpRequests1dGroups(limit:${r.days}, filter:{date_geq:"${r.dateGeq}", date_lt:"${r.dateLt}"}, orderBy:["date_ASC"]) { dimensions { date } sum { requests bytes encryptedRequests threats } }
    v: httpRequestsAdaptiveGroups(limit:1, filter:{datetime_geq:"${r.start}", datetime_lt:"${r.end}"}) { sum { visits edgeResponseBytes } }
    a: httpRequestsAdaptiveGroups(limit:8, filter:{datetime_geq:"${r.start}", datetime_lt:"${r.end}"}, orderBy:["count_DESC"]) { count dimensions { clientCountryName } }
    c: httpRequestsAdaptiveGroups(limit:8, filter:{datetime_geq:"${r.start}", datetime_lt:"${r.end}"}, orderBy:["count_DESC"]) { count dimensions { cacheStatus } }
    d: httpRequestsAdaptiveGroups(limit:8, filter:{datetime_geq:"${r.start}", datetime_lt:"${r.end}"}, orderBy:["count_DESC"]) { count dimensions { clientDeviceType } }
  } } }`;
  const j=await cfGraphql(q);
  const acc=j&&j.viewer&&j.viewer.accounts&&j.viewer.accounts[0]||{};
  const g=(acc.g||[]).map(x=>({date:x.dimensions&&x.dimensions.date,...(x.sum||{})}));
  const visits=(acc.v&&acc.v[0]&&acc.v[0].sum&&acc.v[0].sum.visits)||0;
  const cacheRows=acc.c||[];const totalReq=g.reduce((s,x)=>s+(x.requests||0),0);
  const cached=cacheRows.reduce((s,x)=>s+((x.dimensions&&x.dimensions.cacheStatus==="hit")?x.count:0),0);
  const sql=async(sql)=>{try{return (await cfCall("POST","/analytics/sql",{query:sql,time_range:{start:r.start,end:r.end},scope:{accountTag:accId}})).rows||[];}catch(e){return [];}};
  const [stRows,orRows,hostRows,pathRows,botRows]=await Promise.all([
    sql("SELECT edgeResponseStatus AS code, count() AS reqs FROM events.httpRequests GROUP BY code ORDER BY reqs DESC LIMIT 12"),
    sql("SELECT originResponseStatus AS code, count() AS reqs, round(avg(originResponseDurationMs)) AS avg_ms FROM events.httpRequests WHERE originResponseStatus > 0 GROUP BY code ORDER BY reqs DESC LIMIT 12"),
    sql("SELECT clientRequestHttpHost AS k, count() AS reqs FROM events.httpRequests GROUP BY k ORDER BY reqs DESC LIMIT 20"),
    sql("SELECT clientRequestPath AS k, count() AS reqs FROM events.httpRequests GROUP BY k ORDER BY reqs DESC LIMIT 20"),
    sql("SELECT verifiedBotCategory AS k, count() AS reqs FROM events.httpRequests GROUP BY k ORDER BY reqs DESC LIMIT 20")]);
  const bytes=g.reduce((s,x)=>s+(x.bytes||0),0),threats=g.reduce((s,x)=>s+(x.threats||0),0),enc=g.reduce((s,x)=>s+(x.encryptedRequests||0),0);
  const points=g.map(x=>({label:(x.date||"").slice(5),requests:x.requests||0,cached:totalReq?Math.round((x.requests||0)*(cached/(totalReq||1))):0,
    uncached:0,bytes:x.bytes||0,threats:x.threats||0,visitors:Math.round((x.requests||0)*(visits/(totalReq||1)))}));
  const status=stRows.map(x=>({code:String(x.code),count:+x.reqs}));
  const errCount=status.filter(s=>+s.code>=500).reduce((s,x)=>s+x.count,0);
  const half=Math.ceil(points.length/2);
  const sum=(a,f)=>a.reduce((s,x)=>s+(x[f]||0),0);
  const dlt=(a,b,f)=>b?+(((a-b)/b)*100).toFixed(1):0;
  liveAn[key]={points:points.length?points:emptyAnalytics(range).points,total:totalReq,cached,cacheRate:totalReq?cached/totalReq*100:0,
    bytes,threats,visitors:visits,status,countries:(acc.a||[]).map(x=>({code:String(x.dimensions&&x.dimensions.clientCountryName||"??"),name:countryName(x.dimensions&&x.dimensions.clientCountryName||""),flag:FLAG(x.dimensions&&x.dimensions.clientCountryName||"?"),count:x.count})),
    hosts:hostRows.slice(0,8).map(x=>({host:x.k,count:+x.reqs})),types:[],errCount,errRate:totalReq?errCount/totalReq*100:0,
    drill:{path:pathRows.map(x=>({k:x.k,count:+x.reqs})),bot:botRows.map(x=>({k:x.k||"人类流量",count:+x.reqs})),
      device:(acc.d||[]).map(x=>({k:x.dimensions&&x.dimensions.clientDeviceType||"未知",count:x.count})),cache:cacheRows.map(x=>({k:x.dimensions&&x.dimensions.cacheStatus||"?",count:x.count}))},
    origin:{count:orRows.reduce((s,x)=>s+ +x.reqs,0),avgMs:orRows.length?Math.round(orRows.reduce((s,x)=>s+(+x.avg_ms*(+x.reqs)),0)/Math.max(1,orRows.reduce((s,x)=>s+ +x.reqs,0))):0},
    httpsRate:totalReq?enc/totalReq*100:0,
    deltas:{requests:dlt(sum(points.slice(half),"requests"),sum(points.slice(0,half),"requests")),bytes:dlt(sum(points.slice(half),"bytes"),sum(points.slice(0,half),"bytes")),visitors:dlt(sum(points.slice(half),"visitors"),sum(points.slice(0,half),"visitors")),threats:dlt(sum(points.slice(half),"threats"),sum(points.slice(0,half),"threats")),errors:0,cache:0},
    peak:Math.max(0,...points.map(p=>p.requests)),_live:true};
  const rr=parseHash();if(rr.key==="overview"||rr.key==="deep")render();
}
function liveAnalytics(accId,range){
  const key=accId+"|"+range;
  if(!liveAn[key]){liveAn[key]=emptyAnalytics(range);liveAnFetch(accId,range,key).catch(e=>{liveAn[key]=emptyAnalytics(range);liveAn[key]._err=e.message;const rr=parseHash();if(rr.key==="overview"||rr.key==="deep")render();});}
  return liveAn[key];
}

/* ================= 启动 ================= */
applyTheme();
document.body.insertAdjacentHTML("afterbegin",`<div class="ambient"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>`);
$("#m-shell").innerHTML=`<header class="appbar" id="appbar"></header><main class="screen" id="screen"></main>
  <nav class="m-tabbar" aria-label="主导航">${TABS.map(t=>`<button class="m-tab" data-key="${t.key}">${icon(t.icon,21)}<span>${t.label}</span></button>`).join("")}</nav>`;
document.querySelectorAll(".m-tab").forEach(b=>{
  b.onclick=()=>{
  const target="#/"+b.dataset.key;
  if(location.hash===target)render();else location.hash=target;};
});
if(!location.hash)location.hash="#/overview";
/* ---- 直连启动：先清空演示数据（避免误认为真），同步成功才渲染 ---- */
function reloadClean(){
  // 模式切换后的重载不应再被外部注入的 ?mode/?token/?reset 覆盖：剥掉这些种子参数再刷新
  try{
    if(!location.search)return void location.reload();
    const sp=new URLSearchParams(location.search);let touched=false;
    ["reset","mode","token","notoken"].forEach(k=>{if(sp.has(k)){sp.delete(k);touched=true;}});
    if(!touched)return void location.reload();
    const q=sp.toString();
    location.href=location.pathname+(q?"?"+q:"")+location.hash;
    // 兜底：若因 file:// 同源未触发导航，强制刷新
    setTimeout(()=>location.reload(),120);
  }catch(e){location.reload();}
}
function liveWipe(){
  accounts.length=0;zones.length=0;workers.length=0;pagesProjects.length=0;
  d1s.length=0;kvs.length=0;r2s.length=0;apiTokens.length=0;
  access.apps.length=0;access.groups.length=0;access.policies.length=0;
  Object.keys(access.orgs).forEach(k=>delete access.orgs[k]);
  state.account=null;state.aggregate=false;
}
function liveHold(title,sub,ic){
  $("#appbar").innerHTML=`<span class="logo-mark">${cfMark(22)}</span>
    <div class="ab-title"><b>CF-next</b><small>直连 LIVE · 未就绪</small></div>`;
  document.querySelectorAll(".m-tab").forEach(b=>b.classList.toggle("on",b.dataset.key==="overview"));
  $("#screen").innerHTML=emptyBlock(ic,title,sub);
}
function liveRetrySheet(kind){
  const {el,close}=sheet(kind==="notoken"?"直连模式：还差一把令牌":"直连同步失败",`
    <div class="note ${kind==="notoken"?"warn":"bad"} mb">${icon("alert")}<span>${
      kind==="notoken"
        ?"直连模式用你自己的 Cloudflare API Token 读真实数据。演示数据已从界面清空，避免和真实数据混淆。令牌在 dash.cloudflare.com → My Profile → API Tokens 创建（建议 Zone / Member / Workers / D1 / KV / R2 / Access 只读 + 编辑权限）。"
        :"读取真实 API 失败，界面内不含演示数据。常见原因：令牌无效或权限不足 · 浏览器直连被 CORS 拦（APK 内走原生网络栈无此限制）· 网关地址写错 · 离线。"}
      ${live.error?`<br><span class="mono" style="font-size:11px">${esc(live.error)}</span>`:""}${live.diag?`<br><span class="mono" style="font-size:10.5px;color:var(--muted)">诊断 kind=${esc(live.diag.kind)} · http=${live.diag.http} · code=${esc(live.diag.code||"—")} · 环境=${live.diag.env.cap?("APK/"+live.diag.env.platform+(live.diag.env.http?"·CapacitorHttp✓":"·无Http")):"浏览器"}</span>`:""}</span></div>
    <div class="field"><label>API 令牌 / Global API Key（可粘贴）</label>
      <input class="inp mono mask" id="lr-tok" placeholder="cfut_… / Token，或 37 位 Global Key" value="${esc(prefs.get("apiToken",""))}" spellcheck="false" autocomplete="off" style="font-size:11.5px"/></div>
    <div class="field" id="lr-emailwrap" style="${isGlobalKey(prefs.get("apiToken",""))?"":"display:none"}"><label>Global Key 账户邮箱</label>
      <input class="inp" id="lr-email" placeholder="you@example.com" value="${esc(prefs.get("cfEmail",""))}" spellcheck="false" autocomplete="off" style="font-size:11.5px"/></div>
    <div class="help mt">网关：${esc(cfBase())} —— 可在设置里改。环境：${liveEnv().cap?("APK 原生网络（CapacitorHttp "+(liveEnv().http?"已接管":"未接管")+"）"):"浏览器"}</div>`,
    `<button class="btn" id="lr-demo">${icon("db",13)} 切回演示</button>
     <button class="btn ghost" id="lr-set">设置</button>
     <button class="btn primary" id="lr-retry">${icon("refresh",13)} 重试</button>`);
  el.querySelector("#lr-demo").onclick=()=>{prefs.set("mode","demo");reloadClean();};
  el.querySelector("#lr-set").onclick=()=>{close();openSettingsSheet();};
  const lrt=el.querySelector("#lr-tok");
  if(lrt)lrt.addEventListener("input",()=>{el.querySelector("#lr-emailwrap").style.display=isGlobalKey(lrt.value)?"":"none";});
  el.querySelector("#lr-retry").onclick=async()=>{
    const tok=(el.querySelector("#lr-tok").value||"").trim();
    if(!tok)return toast("先填 API 令牌或 Global Key","bad");
    const email=(el.querySelector("#lr-email")?.value||"").trim();
    if(isGlobalKey(tok)&&!email)return toast("这是 Global Key：请填写账户邮箱","bad");
    prefs.set("apiToken",tok);prefs.set("cfEmail",email);
    const btn=el.querySelector("#lr-retry");btn.disabled=true;btn.innerHTML=`${icon("refresh",13)} 同步中…`;btn.querySelector("svg").style.animation="rot .8s linear infinite";
    liveWipe();liveHold("直连同步中…","验证令牌并拉取账号 / 站点 / 计算 / 存储 / Access","refresh");
    const ok=await liveSync();
    btn.disabled=false;btn.innerHTML=`${icon("refresh",13)} 重试`;
    if(ok){close();render();toast("直连已就绪 · 账号 "+accounts.length+" 个 / 站点 "+zones.length+" 个","ok");}
    else{liveHold("直连未就绪",live.error||"同步失败","alert");liveRetrySheet("error");}
  };
}
(async function boot(){
  if(!isLive()){render();return;}
  liveWipe();
  if(!cfTok()){liveHold("直连模式：需要先配置 API 令牌","演示数据已清空：直连界面只会出现真实 API 返回的内容","key");liveRetrySheet("notoken");return;}
  liveHold("直连同步中…","验证令牌并拉取账号 / 站点 / 计算 / 存储 / Access","refresh");
  const ok=await liveSync();
  if(ok){render();toast("直连已就绪 · 账号 "+accounts.length+" 个 / 站点 "+zones.length+" 个","ok");}
  else{liveHold("直连未就绪",live.error||"同步失败","alert");liveRetrySheet("error");}
})();
</script>
